services:
  shopping-list:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopping-list:latest
    container_name: shopping-list
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/shopping-list.db
      - ITEM_IMAGES_PATH=/app/data/item-images
      - RECIPE_IMAGES_PATH=/app/data/recipe-images
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
