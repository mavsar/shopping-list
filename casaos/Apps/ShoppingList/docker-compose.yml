name: shopping-list
services:
  shopping-list:
    image: ghcr.io/mavsar/shopping-list:v1.4.11
    pull_policy: always
    container_name: shopping-list
    environment:
      NODE_ENV: production
      PORT: "5173"
      DATABASE_PATH: /app/data/shopping-list.db
      ITEM_IMAGES_PATH: /app/data/item-images
      RECIPE_IMAGES_PATH: /app/data/recipe-images
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Admin}
    ports:
      - target: 5173
        published: "5173"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
    restart: unless-stopped
    x-casaos:
      envs:
        - container: BOOTSTRAP_ADMIN_USERNAME
          description:
            en_US: Initial admin username.
        - container: BOOTSTRAP_ADMIN_PASSWORD
          description:
            en_US: Initial admin password. Change after first login.
        - container: BOOTSTRAP_ADMIN_NAME
          description:
            en_US: Initial admin display name.
      ports:
        - container: "5173"
          description:
            en_US: Shopping List web UI.
      volumes:
        - container: /app/data
          description:
            en_US: Persistent storage for SQLite database, item images, and recipe images.

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: shopping-list
  author: Primoz
  category: Utilities
  description:
    en_US: Self-hosted shopping list app with list collaboration and item tracking.
  developer: Primoz
  icon: https://raw.githubusercontent.com/mavsar/shopping-list/main/apps/web/public/logo-icon.png
  screenshot_link: []
  tagline:
    en_US: Self-hosted shopping list for CasaOS.
  thumbnail: ""
  tips:
    before_install:
      en_US: |
        This package pulls a pinned image tag from GHCR.
        Bump the tag in `image: ghcr.io/mavsar/shopping-list:vX.Y.Z` when you want to upgrade.

        Default login (if unchanged):
        - username: `admin`
        - password: `admin12345`
  title:
    en_US: Shopping List
  index: /
  port_map: "5173"
